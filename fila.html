<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arkos — Fila de Produção</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#f4f3f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1a1816}
    
.navbar{background:#fff;border-bottom:1px solid #e0ddd8;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:300;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.nav-logo{height:34px;object-fit:contain}
.nav-links{display:flex;gap:4px}
.nav-link{padding:8px 14px;border-radius:6px;font-size:13px;font-weight:500;color:#5a5550;text-decoration:none;transition:background .15s,color .15s}
.nav-link:hover{background:#f4f3f0;color:#1a1816}
.nav-link-active{background:#fff5f5;color:#c53030 !important;font-weight:700}

    /* LOGIN */
    .login-wrap{min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;padding:24px}
    .login-box{background:#fff;border-radius:10px;border:1px solid #e0ddd8;padding:36px 32px;max-width:360px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center}
    .login-box h2{font-size:16px;font-weight:700;margin-bottom:6px}
    .login-box p{font-size:12px;color:#8a8580;margin-bottom:24px}
    .login-box input{width:100%;padding:10px 14px;border:1px solid #d8d5d0;border-radius:6px;font-size:20px;letter-spacing:6px;text-align:center;font-family:inherit;outline:none;margin-bottom:12px}
    .login-box input:focus{border-color:#c53030}
    .login-box button{width:100%;padding:11px;background:#c53030;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit}
    .login-erro{font-size:12px;color:#c53030;margin-top:8px;display:none}
    /* FILA */
    #app{display:none}
    .header-fila{background:#fff;border-bottom:1px solid #e0ddd8;padding:12px 20px}
    .header-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
    .header-title{font-size:15px;font-weight:700}
    .header-sub{font-size:11px;color:#8a8580;margin-top:2px}
    .btn-refresh{padding:7px 14px;background:#f4f3f0;border:1px solid #e0ddd8;border-radius:6px;cursor:pointer;font-size:12px;color:#5a5550;font-family:inherit}
    .filtros{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .btn-filtro{padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12px;font-family:inherit;border:1.5px solid #e0ddd8;background:#f8f7f5;color:#6a6560;display:flex;align-items:center;gap:6px}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
    .btn-filtro.f-rec{background:#fffbf0;border-color:#f5dcb0;color:#b06010}
    .btn-filtro.f-prod{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
    .btn-filtro.f-env{background:#f0fdf4;border-color:#bbf7d0;color:#15803d}
    .btn-filtro.f-all{background:#f1f5f9;border-color:#94a3b8;color:#334155}
    .busca-bar{background:#fff;border-bottom:1px solid #e0ddd8;padding:10px 20px}
    .busca-bar input{width:100%;max-width:480px;background:#f8f7f5;border:1px solid #e0ddd8;border-radius:6px;padding:8px 12px;font-size:13px;font-family:inherit;outline:none;color:#1a1816}
    .content{padding:20px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
    .card{background:#fff;border-radius:8px;border:1px solid #e0ddd8;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-top:3px solid #e0ddd8}
    .card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
    .tags{display:flex;gap:6px;flex-wrap:wrap}
    .tag{font-size:10px;font-weight:600;padding:3px 8px;border-radius:10px}
    .tag-rec{background:#fffbf0;color:#b06010;border:1px solid #f5dcb0}
    .tag-prod{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
    .tag-env{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
    .tag-tipo{background:#f4f3f0;color:#6a6560;border:1px solid #e0ddd8}
    .card-data{font-size:11px;color:#8a8580;white-space:nowrap}
    .card-sol{font-size:13px;font-weight:700;color:#c53030;margin-bottom:4px}
    .card-mat{font-size:12px;color:#3a3835;line-height:1.5;white-space:pre-line;margin-bottom:8px}
    .card-cli{background:#f8f7f5;border-radius:4px;padding:8px 10px;font-size:11px;display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
    .card-rastreio{margin-top:6px;font-size:11px;color:#15803d;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:4px;padding:5px 10px}
    .card-actions{display:flex;gap:8px;margin-top:12px}
    .btn-prod{flex:1;padding:8px 12px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;font-family:inherit}
    .btn-env{flex:1;padding:8px 12px;background:#c53030;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;font-family:inherit}
    .btn-back{padding:8px 12px;background:#f4f3f0;color:#5a5550;border:1px solid #e0ddd8;border-radius:6px;cursor:pointer;font-size:11px;font-family:inherit}
    .env-info{margin-top:10px;font-size:11px;color:#15803d}
    .empty{text-align:center;padding:60px 0;color:#8a8580;font-size:13px}
    .loading{text-align:center;padding:60px 0;color:#8a8580;font-size:13px}
    .erro-box{background:#fff5f5;border:1px solid #fcc;border-radius:6px;padding:10px 14px;font-size:12px;color:#c53030;margin-bottom:16px}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:200}
    .overlay.open{display:flex}
    .modal{background:#fff;border-radius:10px;padding:24px;width:90%;max-width:400px;box-shadow:0 8px 40px rgba(0,0,0,.2)}
    .modal h3{font-size:15px;font-weight:700;margin-bottom:4px}
    .modal-sub{font-size:12px;color:#8a8580;margin-bottom:10px}
    .modal-mat{font-size:12px;color:#5a5550;line-height:1.5;white-space:pre-line;max-height:80px;overflow-y:auto;margin-bottom:16px;background:#f8f7f5;border-radius:4px;padding:8px 10px}
    .modal label{font-size:11px;font-weight:600;color:#5a5550;display:block;margin-bottom:5px}
    .modal input{width:100%;background:#f8f7f5;border:1px solid #d8d5d0;border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;outline:none;margin-bottom:16px}
    .modal-actions{display:flex;gap:8px}
  
    .filtros-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:10px}
    .filtro-grupo{display:flex;flex-direction:column;gap:5px}
    .filtro-label{font-size:10px;font-weight:600;color:#8a8580;letter-spacing:.5px;text-transform:uppercase}
    .filtros-urg{display:flex;gap:6px;flex-wrap:wrap}
    .btn-urg{padding:5px 12px;border-radius:20px;cursor:pointer;font-size:12px;font-family:inherit;border:1.5px solid #d8d5d0;background:#fff;color:#5a5550;transition:all .15s}
    .btn-urg:hover{border-color:#aaa}
    .btn-urg.ativo{font-weight:700}
    .btn-urg.u-normal.ativo{background:#f0fdf4;border-color:#86efac;color:#15803d}
    .btn-urg.u-urgente.ativo{background:#fffbf0;border-color:#f5dcb0;color:#b06010}
    .btn-urg.u-muito.ativo{background:#fff5f5;border-color:#fca5a5;color:#c53030}
    .btn-urg.u-todos.ativo{background:#f1f5f9;border-color:#94a3b8;color:#334155}
    .filtros-data{display:flex;gap:6px;align-items:center}
    .filtros-data input{padding:5px 10px;border:1.5px solid #d8d5d0;border-radius:8px;font-size:12px;font-family:inherit;outline:none;color:#1a1816}
    .filtros-data input:focus{border-color:#c53030}
    .filtros-data label{font-size:12px;color:#6a6560}
    .btn-limpar-data{padding:4px 10px;font-size:11px;background:none;border:1px solid #d8d5d0;border-radius:6px;cursor:pointer;color:#8a8580;font-family:inherit}
    .badge-urg{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;margin-left:4px}
    .badge-normal{background:#f0fdf4;color:#15803d}
    .badge-urgente{background:#fffbf0;color:#b06010}
    .badge-muito{background:#fff5f5;color:#c53030}

    
    /* RESUMO TOP */
    .resumo-bar{background:#1a1816;color:#fff;padding:10px 20px;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
    .resumo-item{display:flex;align-items:center;gap:6px;font-size:13px}
    .resumo-num{font-size:18px;font-weight:700}
    .resumo-sep{color:#555;font-size:18px}
    .r-hoje{color:#f59e0b}.r-atrasado{color:#ef4444}.r-prod{color:#60a5fa}.r-ok{color:#86efac}
    /* SORT */
    .sort-row{display:flex;align-items:center;gap:8px;padding:8px 0 0}
    .sort-label{font-size:10px;font-weight:600;color:#8a8580;letter-spacing:.5px;text-transform:uppercase}
    .btn-sort{padding:5px 12px;border-radius:20px;cursor:pointer;font-size:12px;font-family:inherit;border:1.5px solid #d8d5d0;background:#fff;color:#5a5550}
    .btn-sort.ativo{background:#1a1816;border-color:#1a1816;color:#fff;font-weight:600}
    /* CRONOGRAMA */
    .crono-wrap{padding:16px 20px;overflow-y:auto;height:calc(100vh - 260px)}
    .crono-timeline{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
    .crono-day{flex:0 0 230px;background:#fff;border:1px solid #e0ddd8;border-radius:10px;overflow:hidden}
    .crono-day.cd-hoje{border-color:#f59e0b}
    .crono-day.cd-atrasado{border-color:#ef4444}
    .crono-day-head{padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
    .crono-day.cd-hoje .crono-day-head{background:#fffbf0}
    .crono-day.cd-atrasado .crono-day-head{background:#fff0f0}
    .crono-day.cd-futuro .crono-day-head{background:#f8f7f5}
    .cd-nome{font-size:12px;font-weight:700}
    .cd-data{font-size:10px;color:#6a6560;margin-top:1px}
    .cd-count{background:#e0ddd8;color:#1a1816;border-radius:10px;font-size:10px;font-weight:700;padding:2px 7px}
    .crono-day.cd-hoje .cd-count{background:#f59e0b;color:#fff}
    .crono-day.cd-atrasado .cd-count{background:#ef4444;color:#fff}
    .crono-cards{padding:8px}
    .crono-card{background:#f8f7f5;border-radius:6px;padding:9px 11px;margin-bottom:6px;cursor:default}
    .crono-card:last-child{margin-bottom:0}
    .cc-sol{font-size:11px;font-weight:600;color:#1a1816}
    .cc-mat{font-size:11px;color:#6a6560;margin:3px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .cc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:5px}
    .cc-urg{font-size:10px;font-weight:600}
    .cc-edit{font-size:10px;background:#fff;border:1px solid #d8d5d0;border-radius:4px;padding:2px 7px;cursor:pointer;color:#5a5550;font-family:inherit}
    .cc-edit:hover{background:#f4f3f0}
    .crono-sem-data{flex:0 0 200px;background:#f8f7f5;border:1px dashed #d8d5d0;border-radius:10px;overflow:hidden}
    /* MODAL EDIT DATE */
    .modal-date-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;align-items:center;justify-content:center}
    .modal-date-overlay.open{display:flex}
    .modal-date{background:#fff;border-radius:10px;padding:24px;width:90%;max-width:340px;box-shadow:0 8px 40px rgba(0,0,0,.2)}
    .md-title{font-size:14px;font-weight:700;margin-bottom:4px}
    .md-sub{font-size:11px;color:#6a6560;margin-bottom:16px}
    .md-label{font-size:10px;font-weight:600;color:#5a5550;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
    .md-input{width:100%;padding:9px 12px;border:1px solid #d8d5d0;border-radius:6px;font-size:14px;font-family:inherit;outline:none;margin-bottom:16px}
    .md-input:focus{border-color:#c53030}
    .md-actions{display:flex;gap:8px}
    .md-save{flex:1;padding:10px;background:#c53030;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit}
    .md-cancel{flex:1;padding:10px;background:#f4f3f0;border:1px solid #e0ddd8;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;color:#5a5550}
    .crono-empty{padding:40px 0;text-align:center;color:#8a8580;font-size:13px}

    </style>
</head>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwfENYrCbmgdBzI5qgn2sy0llromxbaXd5u14kxT9HkRXtIMqBg7xGqqbbgw9C9uiKC/exec";
const SENHA_CORRETA = "1989";
let pedidos=[], filtro="recebido", filtroUrg="todos", modalPedido=null, modalStatus=null;

function getUrgencia(p){
  // Default: todos os existentes = Urgente
  return p.urgencia && p.urgencia.trim() ? p.urgencia.trim() : "Urgente";
}

function parseDataPedido(str){
  if(!str) return null;
  // Format is DD/MM (from Apps Script fmtDate)
  const m = str.match(/^(\d{1,2})\/(\d{1,2})/);
  if(!m) return null;
  const hoje = new Date();
  return new Date(hoje.getFullYear(), parseInt(m[2])-1, parseInt(m[1]));
}

function setUrg(v){
  filtroUrg=v;
  ["todos","normal","urgente","muito"].forEach(id=>{
    const el=document.getElementById("u-"+id);
    if(el) el.className=el.className.replace(" ativo","");
  });
  const map={"todos":"todos","Normal":"normal","Urgente":"urgente","Muito Urgente":"muito"};
  const el=document.getElementById("u-"+(map[v]||v));
  if(el) el.className+=" ativo";
  renderCards();
}

function limparDatas(){
  document.getElementById("data-de").value="";
  document.getElementById("data-ate").value="";
  renderCards();
}

// ── LOGIN ──
function verificarSenha(){
  const s=document.getElementById("senha-input").value;
  if(s===SENHA_CORRETA){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    carregar();
  }else{
    document.getElementById("login-erro").style.display="block";
    document.getElementById("senha-input").value="";
    document.getElementById("senha-input").focus();
  }
}

// ── DADOS ──
function getStatus(p){return p.finalizado?"enviado":p.emProducao?"producao":"recebido";}

async function carregar(){
  document.getElementById("loading").style.display="block";
  document.getElementById("grid").style.display="none";
  document.getElementById("empty").style.display="none";
  document.getElementById("erro-box").style.display="none";
  try{
    const r=await fetch(SCRIPT_URL+"?action=fila");
    const d=await r.json();
    if(d.success){
      pedidos=d.pedidos||[];
      pedidos.reverse();
      try{ atualizarContadores(); }catch(e2){ console.error('atualizarContadores erro:',e2); }
      try{ renderCards(); }catch(e3){ console.error('renderCards erro:',e3); }
    } else {
      mostrarErro("Erro do servidor: "+(d.error||"desconhecido"));
    }
  }catch(e){
    console.error('Erro carregar fila:',e);
    mostrarErro("Não foi possível conectar: "+e.message);
  }
  document.getElementById("loading").style.display="none";
}

function mostrarErro(m){const e=document.getElementById("erro-box");e.textContent=m;e.style.display="block";}

function atualizarContadores(){
  const c={recebido:0,producao:0,enviado:0};
  pedidos.forEach(p=>c[getStatus(p)]++);
  document.getElementById("c-rec").textContent=c.recebido;
  document.getElementById("c-prod").textContent=c.producao;
  document.getElementById("c-env").textContent=c.enviado;
  document.getElementById("c-all").textContent=pedidos.length;
  try{atualizarResumo();}catch(e){}
}

function setFiltro(f){
  filtro=f;
  ["f-rec","f-prod","f-env","f-all","f-crono"].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.className="btn-filtro"+(id==="f-crono"?" f-crono":"");
  });
  const cls={recebido:"f-rec f-rec",producao:"f-prod f-prod",enviado:"f-env f-env",todos:"f-all f-all",cronograma:"f-crono"};
  const map={recebido:"f-rec",producao:"f-prod",enviado:"f-env",todos:"f-all",cronograma:"f-crono"};
  const el=document.getElementById(map[f]);
  if(el) el.className+=" ativo";
  const isCreno=f==="cronograma";
  const grid=document.getElementById("grid");
  const empty=document.getElementById("empty");
  const crono=document.getElementById("crono-wrap");
  if(grid) grid.style.display=isCreno?"none":"grid";
  if(empty) empty.style.display="none";
  if(crono) crono.style.display=isCreno?"block":"none";
  if(isCreno) renderCronograma(); else renderCards();
}



// ── MODAL ──
function abrirModal(id,novoStatus){
  modalPedido=pedidos.find(p=>p.id===id); modalStatus=novoStatus;
  if(!modalPedido)return;
  const titulos={producao:"Iniciar produção",enviado:"Confirmar envio",recebido:"Voltar para Recebido"};
  document.getElementById("modal-titulo").textContent=titulos[novoStatus];
  document.getElementById("modal-sub").textContent=modalPedido.comercial+(modalPedido.cliente||modalPedido.empresa?" · "+(modalPedido.cliente||modalPedido.empresa):"");
  document.getElementById("modal-mat").textContent=modalPedido.material;
  const showR=novoStatus==="enviado";
  document.getElementById("modal-rastreio-wrap").style.display=showR?"block":"none";
  if(showR){document.getElementById("modal-rastreio-label").textContent="Código de rastreio"+(modalPedido.tipo==="Correios"?" *":"");document.getElementById("modal-rastreio").value="";}
  document.getElementById("modal-overlay").classList.add("open");
}

function fecharModal(){document.getElementById("modal-overlay").classList.remove("open");modalPedido=null;modalStatus=null;}

async function confirmar(){
  if(!modalPedido)return;
  const rastreio=(document.getElementById("modal-rastreio").value||"").trim();
  if(modalStatus==="enviado"&&modalPedido.tipo==="Correios"&&!rastreio){alert("Informe o código de rastreio para Correios.");return;}
  document.getElementById("modal-confirmar").textContent="Salvando...";
  document.getElementById("modal-confirmar").disabled=true;
  const payload={action:"update_status",id:modalPedido.id,recebido:true,
    emProducao:modalStatus==="producao"||modalStatus==="enviado",
    finalizado:modalStatus==="enviado",rastreio};
  try{
    await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload),mode:"no-cors"});
    const idx=pedidos.findIndex(p=>p.id===modalPedido.id);
    if(idx>=0){pedidos[idx].emProducao=payload.emProducao;pedidos[idx].finalizado=payload.finalizado;if(rastreio)pedidos[idx].rastreio=rastreio;if(payload.finalizado)pedidos[idx].dataEnvio=new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});}
    atualizarContadores();renderCards();fecharModal();
  }catch(e){alert("Erro ao salvar. Tente novamente.");}
  document.getElementById("modal-confirmar").textContent="Confirmar";
  document.getElementById("modal-confirmar").disabled=false;
}

document.addEventListener("keydown",e=>{if(e.key==="Escape"){fecharModal();fecharModalDate();}});

const DIAS_SEMANA = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
let sortMode = 'data';
let modalDatePedido = null;

// ── URGÊNCIA ──
function getUrgencia(p){
  if(!p.urgencia||!p.urgencia.trim()) return 'Urgente';
  if(p.urgencia.includes('Muito')) return 'Muito Urgente';
  if(p.urgencia.includes('Normal')) return 'Normal';
  return 'Urgente';
}
function urgPeso(p){ const u=getUrgencia(p); return u==='Muito Urgente'?0:u==='Urgente'?1:2; }

// ── DATAS ──
function calcPrevDate(p){
  if(p.prev){ const d=parseDDMM(p.prev); if(d) return d; }
  const dp=parseDDMM(p.data); if(!dp) return null;
  const dias=getUrgencia(p)==='Muito Urgente'?1:getUrgencia(p)==='Normal'?7:3;
  const r=new Date(dp); r.setDate(r.getDate()+dias); return r;
}
function parseDDMM(str){
  if(!str) return null;
  const m=str.match(/^(\d{1,2})\/(\d{1,2})/);
  if(!m) return null;
  const hoje=new Date();
  const d=new Date(hoje.getFullYear(),parseInt(m[2])-1,parseInt(m[1]));
  return d;
}
function fmtDate(d){
  if(!d) return '';
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
function fmtDateInput(d){
  if(!d) return '';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function isSameDay(a,b){ return a&&b&&a.getDate()===b.getDate()&&a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear(); }

// ── SORT ──
function setSort(mode){
  sortMode=mode;
  document.getElementById('sort-data').className='btn-sort'+(mode==='data'?' ativo':'');
  document.getElementById('sort-urg').className='btn-sort'+(mode==='prioridade'?' ativo':'');
  renderCards();
}

function sortedList(lista){
  if(sortMode==='prioridade'){
    return [...lista].sort((a,b)=>urgPeso(a)-urgPeso(b));
  }
  // Sort by data (newest first for default; oldest first for chronological)
  return [...lista].sort((a,b)=>{
    const da=parseDDMM(a.data), db=parseDDMM(b.data);
    if(!da&&!db) return 0; if(!da) return 1; if(!db) return -1;
    return da-db;
  });
}

// ── RESUMO BAR ──
function atualizarResumo(){
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  const abertos=pedidos.filter(p=>!p.finalizado);
  let atrasado=0,paraHoje=0,prod=0;
  abertos.forEach(p=>{
    const prev=calcPrevDate(p);
    if(prev){ if(prev<hoje) atrasado++; else if(isSameDay(prev,hoje)) paraHoje++; }
    if(p.emProducao&&!p.finalizado) prod++;
  });
  document.getElementById('r-atrasado').textContent=atrasado;
  document.getElementById('r-hoje').textContent=paraHoje;
  document.getElementById('r-prod').textContent=prod;
  document.getElementById('r-total').textContent=abertos.length;
  document.getElementById('resumo-bar').style.display=abertos.length?'flex':'none';
}

  if(isCreno) renderCronograma(); else renderCards();
}

// ── CRONOGRAMA ──
function renderCronograma(){
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  const abertos=pedidos.filter(p=>!p.finalizado);
  // Sort by prevDate
  const sorted=[...abertos].sort((a,b)=>{
    const da=calcPrevDate(a),db=calcPrevDate(b);
    if(!da&&!db)return 0;if(!da)return 1;if(!db)return -1;return da-db;
  });

  // Group by prevDate day
  const groups={};
  const semData=[];
  sorted.forEach(p=>{
    const prev=calcPrevDate(p);
    if(!prev){semData.push(p);return;}
    const key=prev.toDateString();
    if(!groups[key]) groups[key]={date:prev,items:[]};
    groups[key].items.push(p);
  });

  const keys=Object.keys(groups).sort((a,b)=>new Date(a)-new Date(b));
  const urgLabel={'Normal':'🟢 Normal','Urgente':'🟡 Urgente','Muito Urgente':'🔴 Muito urgente'};

  let html='<div class="crono-timeline">';
  if(!keys.length&&!semData.length){
    html+='<div class="crono-empty">Nenhum pedido em aberto.</div>';
  }
  keys.forEach(key=>{
    const g=groups[key];
    const d=g.date;
    const isPast=d<hoje&&!isSameDay(d,hoje);
    const isHoje=isSameDay(d,hoje);
    const cls=isPast?'cd-atrasado':isHoje?'cd-hoje':'cd-futuro';
    const diaSem=DIAS_SEMANA[d.getDay()===0?6:d.getDay()-1];
    const dataStr=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
    html+=`<div class="crono-day ${cls}">
      <div class="crono-day-head">
        <div><div class="cd-nome">${isHoje?'Hoje':isPast?'⚠ '+diaSem:diaSem}</div><div class="cd-data">${dataStr}</div></div>
        <span class="cd-count">${g.items.length}</span>
      </div>
      <div class="crono-cards">`;
    g.items.forEach(p=>{
      const u=getUrgencia(p);
      const urgColor=u==='Muito Urgente'?'#c53030':u==='Normal'?'#15803d':'#b06010';
      html+=`<div class="crono-card">
        <div class="cc-sol">${p.comercial}</div>
        <div class="cc-mat">${p.material}</div>
        <div class="cc-foot">
          <span class="cc-urg" style="color:${urgColor}">${urgLabel[u]||u}</span>
          <button class="cc-edit" onclick="abrirModalDate('${p.id}','${p.comercial}','${p.material.replace(/'/g,"\\'")}')">✏ Data</button>
        </div>
      </div>`;
    });
    html+='</div></div>';
  });
  if(semData.length){
    html+=`<div class="crono-sem-data">
      <div class="crono-day-head"><div><div class="cd-nome">Sem data</div><div class="cd-data">Indefinido</div></div><span class="cd-count">${semData.length}</span></div>
      <div class="crono-cards">`;
    semData.forEach(p=>{
      const u=getUrgencia(p);
      const urgColor=u==='Muito Urgente'?'#c53030':u==='Normal'?'#15803d':'#b06010';
      html+=`<div class="crono-card">
        <div class="cc-sol">${p.comercial}</div>
        <div class="cc-mat">${p.material}</div>
        <div class="cc-foot">
          <span class="cc-urg" style="color:${urgColor}">${u}</span>
          <button class="cc-edit" onclick="abrirModalDate('${p.id}','${p.comercial}','${p.material.replace(/'/g,"\\'")}')">✏ Data</button>
        </div>
      </div>`;
    });
    html+='</div></div>';
  }
  html+='</div>';
  document.getElementById('crono-timeline').innerHTML=html;
}

// ── MODAL EDITAR DATA ──
function abrirModalDate(id,comercial,material){
  modalDatePedido=pedidos.find(p=>p.id===id);
  if(!modalDatePedido)return;
  document.getElementById('md-sub').textContent=comercial+' · '+material;
  const prev=calcPrevDate(modalDatePedido);
  document.getElementById('md-input').value=prev?fmtDateInput(prev):'';
  document.getElementById('modal-date-overlay').classList.add('open');
}
function fecharModalDate(){
  document.getElementById('modal-date-overlay').classList.remove('open');
  modalDatePedido=null;
}
async function salvarDataPrev(){
  if(!modalDatePedido)return;
  const val=document.getElementById('md-input').value;
  if(!val)return;
  const d=new Date(val+'T00:00:00');
  const ddmm=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
  // Update local
  modalDatePedido.prev=ddmm;
  fecharModalDate();
  atualizarResumo();
  if(filtro==='cronograma') renderCronograma(); else renderCards();
  // Save to planilha
  await fetch("https://script.google.com/macros/s/AKfycbwfENYrCbmgdBzI5qgn2sy0llromxbaXd5u14kxT9HkRXtIMqBg7xGqqbbgw9C9uiKC/exec",{method:'POST',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({action:'update_prev',id:modalDatePedido.id,prev:val}),mode:'no-cors'});
}

function renderCards(){
  const busca=document.getElementById("busca").value.toLowerCase();
  const dataDe=document.getElementById("data-de")?document.getElementById("data-de").value:"";
  const dataAte=document.getElementById("data-ate")?document.getElementById("data-ate").value:"";
  let lista=pedidos.filter(p=>{
    const s=getStatus(p);
    if(filtro!=="todos"&&filtro!=="cronograma"&&s!==filtro) return false;
    if(busca&&![p.comercial,p.cliente,p.empresa,p.material].join(" ").toLowerCase().includes(busca)) return false;
    if(filtroUrg!=="todos"&&getUrgencia(p)!==filtroUrg) return false;
    if(dataDe||dataAte){
      const dp=parseDataPedido(p.data);
      if(dp){
        if(dataDe&&dp<new Date(dataDe)) return false;
        if(dataAte){const ate=new Date(dataAte);ate.setDate(ate.getDate()+1);if(dp>ate) return false;}
      }
    }
    return true;
  });
  lista=sortedList(lista);

  if(!lista.length){grid.style.display="none";empty.style.display="block";empty.textContent=busca?"Nenhum pedido encontrado.":"Nenhum pedido neste status.";return;}
  grid.style.display="grid";empty.style.display="none";
  const icon={Motoboy:"🛵",Correios:"📦",Representantes:"🤝"};
  const dotColor={recebido:"#f59e0b",producao:"#3b82f6",enviado:"#22c55e"};
  const tagCls={recebido:"tag-rec",producao:"tag-prod",enviado:"tag-env"};
  const tagLabel={recebido:"Recebido",producao:"Em Produção",enviado:"Enviado"};
  grid.innerHTML=lista.map(p=>{
    const s=getStatus(p);
    const cli=p.cliente||p.empresa?"<div class='card-cli'>"+(p.cliente?`<strong>${p.cliente}</strong>`:"")+
      (p.empresa?`<span style='color:#6a6560'>${p.empresa}</span>`:"")+
      (p.telefone?`<span style='color:#6a6560'>📞 ${p.telefone}</span>`:"")+
      "</div>":"";
    const rastreio=p.rastreio?`<div class='card-rastreio'>🚚 ${p.rastreio}</div>`:"";
    const acoes=s==="recebido"?
      `<div class='card-actions'><button class='btn-prod' onclick='abrirModal("${p.id}","producao")'>Iniciar produção →</button></div>`:
      s==="producao"?
      `<div class='card-actions'><button class='btn-back' onclick='abrirModal("${p.id}","recebido")'>← Voltar</button><button class='btn-env' onclick='abrirModal("${p.id}","enviado")'>Marcar enviado ✓</button></div>`:"";
    const envInfo=s==="enviado"&&p.dataEnvio?`<div class='env-info'>✓ Enviado em ${p.dataEnvio}</div>`:"";
    const urg=getUrgencia(p);
    const urgBadge=urg==="Muito Urgente"?`<span class='badge-urg badge-muito'>🔴 Muito urgente</span>`:urg==="Normal"?`<span class='badge-urg badge-normal'>🟢 Normal</span>`:`<span class='badge-urg badge-urgente'>🟡 Urgente</span>`;
    const prev=calcPrevDate(p);
    const dataLabel=p.data?`<span style='font-size:10px;color:#8a8580;margin-left:6px'>📅 ${p.data}</span>`:"";
    const prevLabel=prev?`<span style='font-size:10px;color:#6a6560;margin-left:6px'>📦 envio ${fmtDate(prev)}</span>`:"";
    return `<div class='card' style='border-top-color:${dotColor[s]}'>
      <div class='card-head'><div class='tags'><span class='tag ${tagCls[s]}'>${tagLabel[s]}</span>${urgBadge}${dataLabel}${prevLabel}<span class='tag tag-tipo'>${icon[p.tipo]||""} ${p.tipo}</span></div></div>
      <div class='card-sol'>${p.comercial}</div>
      <div class='card-mat'>${p.material}</div>
      ${cli}${rastreio}${acoes}${envInfo}
    </div>`;
  }).join("");
}
